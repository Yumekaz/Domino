name: Domino PR impact check

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: domino-pr-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact:
    name: Compute structural impact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted analyzer at the base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: analyzer
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout PR head as read-only target data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Remove target Git metadata
        run: rm -rf target/.git

      - name: Check trusted analyzer availability at the base revision
        id: analyzer
        run: |
          if [ -f analyzer/packages/dependency-adapter/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Domino PR impact check not yet bootstrapped"
              echo ""
              echo "The base revision does not contain the trusted analyzer package. This workflow becomes active after the analyzer is merged into the base branch. No impact result was computed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.analyzer.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: analyzer/packages/dependency-adapter/package-lock.json

      - name: Install the pinned analyzer only
        if: steps.analyzer.outputs.present == 'true'
        working-directory: analyzer/packages/dependency-adapter
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Diagnose analyzer cwd
        if: steps.analyzer.outputs.present == 'true'
        shell: bash
        run: |
          node -e "const fs=require('fs'); const file=process.env.GITHUB_WORKSPACE+'/target/apps/web/tsconfig.json'; fs.writeFileSync('/tmp/dc-config.json', JSON.stringify({forbidden:[],options:{parser:'tsc',tsPreCompilationDeps:true,doNotFollow:{path:'node_modules'},exclude:{path:'(^|/)(node_modules|dist|build|out|coverage|vendor|__generated__|generated|\\\\.git|\\\\.next|\\\\.cache)(/|$)'},tsConfig:{fileName:file}}}))"
          cd target
          echo "cwd=$(pwd)"
          node ../analyzer/node_modules/dependency-cruiser/bin/dependency-cruiser.mjs apps/web/src --config /tmp/dc-config.json --output-type json --progress none > /tmp/dc-cwd.json 2>/tmp/dc-cwd.err || true
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/dc-cwd.json','utf8')); console.log('cwd modules', j.modules?.length, 'baseDir', j.summary?.optionsUsed?.baseDir);"
          head -10 /tmp/dc-cwd.err
          node -e "const fs=require('fs'); fs.writeFileSync('/tmp/dc-no-tsconfig.json', JSON.stringify({forbidden:[],options:{parser:'tsc',tsPreCompilationDeps:true,doNotFollow:{path:'node_modules'},exclude:{path:'(^|/)(node_modules|dist|build|out|coverage|vendor|__generated__|generated|\\\\.git|\\\\.next|\\\\.cache)(/|$)'}}}))"
          node ../analyzer/node_modules/dependency-cruiser/bin/dependency-cruiser.mjs apps/web/src --config /tmp/dc-no-tsconfig.json --output-type json --progress none > /tmp/dc-no-tsconfig-out.json 2>/tmp/dc-no-tsconfig.err || true
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/dc-no-tsconfig-out.json','utf8')); console.log('no-tsconfig modules', j.modules?.length);"
          head -10 /tmp/dc-no-tsconfig.err
      - name: Compute and publish the impact summary
        if: steps.analyzer.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOMINO_ANALYZER_ROOT: ${{ github.workspace }}/analyzer
          DOMINO_TARGET_ROOT: ${{ github.workspace }}/target
          DOMINO_TARGET_PATH: ${{ vars.DOMINO_TARGET_PATH || '.' }}
          DOMINO_TSCONFIG: ${{ vars.DOMINO_TSCONFIG || '' }}
        run: node analyzer/integrations/github-action/analyze-pr.mjs
