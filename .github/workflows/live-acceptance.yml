name: Live public acceptance

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository URL to import
        required: true
        default: https://github.com/sindresorhus/yocto-queue

permissions:
  contents: read

concurrency:
  group: domino-live-acceptance
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://domino:acceptance@127.0.0.1:5432/domino
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: domino
          POSTGRES_PASSWORD: acceptance
          POSTGRES_DB: domino
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U domino -d domino"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:migrate
      - name: Run live public acceptance
        env:
          DOMINO_ACCEPT_REPO: ${{ inputs.repository }}
          DOMINO_GITHUB_TOKEN: ${{ secrets.DOMINO_GITHUB_TOKEN }}
        run: npx tsx tests/live/public-acceptance.ts
